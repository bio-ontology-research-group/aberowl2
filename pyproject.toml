[project]
name = "aberowl2"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "aiohttp",
    "python-multipart",
    "redis",
    "mcp>=1.28.1,<2.0",
    "pyyaml",
    "aiofiles",
    "slowapi",
    "rdflib",
]

[project.optional-dependencies]
evaluation = [
    "httpx",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "requests",
    "httpx",
    "fakeredis",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 900          # 15 min hard cap per test (GO classification can be slow)
# Apply timeouts to the test body only. Docker fixtures build images and wait up
# to 180 s (600 s for GO) for a worker to classify, and that setup is charged to
# whichever test runs first; without this, a per-test marker shorter than the
# fixture's own budget kills setup and the suite cannot start from cold.
timeout_func_only = true
testpaths = ["tests", "central_server/tests"]
# Exclude pre-existing tests that require gevent (aberowlapi/). They also reach
# a worker at import time, so they must stay out of the default run.
norecursedirs = ["tests/aberowlapi"]
markers = [
    "slow: tests that spin up Docker containers and may take several minutes",
    "bioportal: tests that call the live BioPortal API",
    "unit: fast tests that do not require Docker",
    "live: tests that run against beta.aber-owl.net",
]

[tool.uv]
# run tests with:  uv run --extra test pytest tests/ -v
