# /api/sparql answers an AberOWL 1 query with a 302 to the endpoint named in the
# query, and the rewritten query travels in the Location header. A frame
# resolving to ~95 classes makes that header about 5.8 KB. nginx buffers response
# HEADERS in proxy_buffer_size regardless of `proxy_buffering off`, which governs
# the body, and the 4 KB default makes it reject the response with 502.
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;
}
