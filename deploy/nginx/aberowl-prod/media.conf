# Ontology file downloads.
#
# Served by the application, which streams the current corpus from
# /data/ontologies. This deliberately does NOT alias the AberOWL 1 store at
# /opt/aberowl/aberowlweb/media/: that store is a separate, frozen copy, and
# serving it would hand callers files that are not the ones AberOWL reasons over.
#
# `download_url` in /api/listOntologies and /api/ontology/ points here as a
# relative path, because consumers prefix it with the site root.
location /media/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ontology files reach ~2 GB; stream rather than buffer to disk.
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 600s;
    send_timeout 1200s;
}
